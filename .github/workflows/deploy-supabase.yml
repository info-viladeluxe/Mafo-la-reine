name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
  workflow_dispatch: {} # allow a manual "Run workflow" click from the Actions tab

permissions:
  contents: write # needed so the debug-log step below can commit back to the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        id: db_push
        continue-on-error: true # let later steps run, and let us save the log, before failing the job
        run: |
          set -o pipefail
          supabase db push --yes 2>&1 | tee /tmp/db_push.log
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy edge functions
        run: supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Set PSP secrets
        # Values come from GitHub Actions repo secrets, never from this repo.
        # Only secrets that are actually set in the repo are pushed — an
        # unset GitHub secret resolves to an empty string, and blindly
        # running `supabase secrets set X=""` would overwrite a real,
        # already-configured value on the Supabase side with nothing. So we
        # build the argument list in bash and skip any empty value instead.
        #
        # NOTE: GitHub Actions runs multi-line `run:` blocks with `set -e`
        # (errexit) by default. `[ -n "$2" ] && args+=(...)` as a bare
        # statement makes the WHOLE line's exit code 1 whenever the test is
        # false — under -e that aborts the entire script immediately, on the
        # very first unset optional secret. Using if/then avoids that: an
        # `if` condition's exit status is never itself treated as a script
        # error by -e. This is why this step failed on every run so far,
        # even though nothing was actually wrong with the (absent) PSP
        # secrets — none had been added to GitHub yet, and this bug made any
        # of them being unset a fatal script error instead of a no-op.
        continue-on-error: true # best-effort — don't fail the whole deploy over optional PSP secrets
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("$1=$2"); fi; }
          add PAYUNIT_API_USER "$PAYUNIT_API_USER"
          add PAYUNIT_API_PASSWORD "$PAYUNIT_API_PASSWORD"
          add PAYUNIT_API_KEY "$PAYUNIT_API_KEY"
          add PAYUNIT_MODE "$PAYUNIT_MODE"
          add PAYSTACK_SECRET_KEY "$PAYSTACK_SECRET_KEY"
          add PAYSTACK_CURRENCY "$PAYSTACK_CURRENCY"
          add FLUTTERWAVE_SECRET_KEY "$FLUTTERWAVE_SECRET_KEY"
          add FLUTTERWAVE_PUBLIC_KEY "$FLUTTERWAVE_PUBLIC_KEY"
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set "${args[@]}"
          else
            echo "No PSP secrets set in the GitHub repo — skipping."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          PAYUNIT_API_USER: ${{ secrets.PAYUNIT_API_USER }}
          PAYUNIT_API_PASSWORD: ${{ secrets.PAYUNIT_API_PASSWORD }}
          PAYUNIT_API_KEY: ${{ secrets.PAYUNIT_API_KEY }}
          PAYUNIT_MODE: ${{ secrets.PAYUNIT_MODE }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_CURRENCY: ${{ secrets.PAYSTACK_CURRENCY }}
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}

      - name: Save db push log to the repo (debugging aid)
        # GitHub Actions automatically masks any value matching a configured
        # secret with *** wherever it would appear in log output, including
        # here, so this is safe to commit even though the step above ran
        # with DB credentials in its environment.
        #
        # Uses the Contents API directly instead of `git push` — actions/
        # checkout leaves the workspace in detached HEAD by default, so a
        # bare `git push` has no target ref and fails (which continue-on-
        # error then silently masked as a 'success' conclusion last time,
        # so the file never actually landed despite the step looking green).
        continue-on-error: true
        if: always()
        run: |
          cp /tmp/db_push.log /tmp/last-db-push.log 2>/dev/null || echo "(no log captured)" > /tmp/last-db-push.log
          python3 << 'PYEOF'
          import base64, json, os, urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          path = ".github/deploy-logs/last-db-push.log"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/contents/{path}", headers=headers)
          sha = None
          try:
              with urllib.request.urlopen(req) as r:
                  sha = json.load(r).get("sha")
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise

          content = open("/tmp/last-db-push.log", "rb").read()
          body = {
              "message": "ci: save db push log [skip ci]",
              "content": base64.b64encode(content).decode(),
              "branch": "main",
          }
          if sha:
              body["sha"] = sha

          put_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}",
              method="PUT",
              headers={**headers, "Content-Type": "application/json"},
              data=json.dumps(body).encode(),
          )
          with urllib.request.urlopen(put_req) as r:
              print("saved log, status", r.status)
          PYEOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Fail the job if migrations didn't actually push
        if: steps.db_push.outcome == 'failure'
        run: exit 1
